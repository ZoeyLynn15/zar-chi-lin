<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Calculator</title><link rel="stylesheet" href="style.css"></head><body><div class="card"><h1>Change Calculator</h1><p>Customer pays 1,000 baht.</p><label for="price">Item price (Baht):</label><input type="number" id="price" min="0" max="1000" placeholder="Enter item price"><button onclick="calculateChange()">Calculate</button><div id="result" class="result"></div><a class="back" href="resume.html">Back to Resume</a></div><script>
function calculateChange(){const input=document.getElementById('price'),out=document.getElementById('result'),paid=1000;if(input.value.trim()===''||!Number.isFinite(input.valueAsNumber)||input.valueAsNumber<0){out.className='result error';out.textContent='Please enter a valid price.';return}if(input.valueAsNumber>paid){out.className='result error';out.textContent='Customer does not have enough money.';return}let change=paid-input.valueAsNumber,remaining=Math.round(change),lines=[];for(const value of [1000,500,100,50,20,10,5,2,1]){const count=Math.floor(remaining/value);remaining%=value;if(count)lines.push(value+' baht: '+count)}out.className='result';out.innerHTML='<h3>Change: '+change.toFixed(2)+' Baht</h3>'+lines.join('<br>')}
</script></body></html>
