<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Measurement Converter</title><link rel="stylesheet" href="style.css"></head><body><div class="card"><h1>Measurement Converter</h1>
<div class="group"><h2>Meter to Centimeter</h2><input type="number" id="meter" placeholder="Enter meters"><button onclick="convert('meter',100,' cm','lengthResult')">Convert</button><p id="lengthResult" class="result"></p></div>
<div class="group"><h2>Centimeter to Meter</h2><input type="number" id="cm" placeholder="Enter centimeters"><button onclick="convert('cm',.01,' m','heightResult')">Convert</button><p id="heightResult" class="result"></p></div>
<div class="group"><h2>Celsius to Fahrenheit</h2><input type="number" id="celsius" placeholder="Enter Celsius"><button onclick="temperature()">Convert</button><p id="tempResult" class="result"></p></div>
<div class="group"><h2>Square Meter to Square Centimeter</h2><input type="number" id="area" placeholder="Enter square meters"><button onclick="convert('area',10000,' cm²','areaResult')">Convert</button><p id="areaResult" class="result"></p></div><a class="back" href="resume.html">Back to Resume</a></div><script>
function getNumber(id,resultId){const input=document.getElementById(id),out=document.getElementById(resultId);if(input.value.trim()===''||!Number.isFinite(input.valueAsNumber)){out.className='result error';out.textContent='Please enter a valid number.';return null}if(input.valueAsNumber<0&&id!=='celsius'){out.className='result error';out.textContent='Please enter zero or a positive number.';return null}out.className='result';return input.valueAsNumber}
function convert(id,multiplier,unit,resultId){const n=getNumber(id,resultId);if(n!==null)document.getElementById(resultId).textContent=(n*multiplier)+unit}
function temperature(){const c=getNumber('celsius','tempResult');if(c!==null)document.getElementById('tempResult').textContent=((c*9/5)+32)+' °F'}
</script></body></html>
