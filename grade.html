<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade Calculator</title><link rel="stylesheet" href="style.css"></head><body><div class="card"><h1>Grade Calculator</h1><label for="score">Enter score (0–100):</label><input type="number" id="score" min="0" max="100" placeholder="Example: 85"><button onclick="calculateGrade()">Submit</button><p id="result" class="result"></p><a class="back" href="resume.html">Back to Resume</a></div><script>
function calculateGrade(){const box=document.getElementById('score'),out=document.getElementById('result');if(box.value.trim()===''||!Number.isFinite(box.valueAsNumber)||box.valueAsNumber<0||box.valueAsNumber>100){out.className='result error';out.textContent='Please enter a score from 0 to 100.';return}const s=box.valueAsNumber;const grade=s>=80?'A':s>=70?'B':s>=60?'C':s>=50?'D':'F';out.className='result';out.textContent='You got a '+grade+'.'}
</script></body></html>
