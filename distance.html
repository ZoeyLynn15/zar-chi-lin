<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Distance from University</title><link rel="stylesheet" href="style.css"></head><body><div class="card"><h1>How Far from University?</h1><p>Enter the horizontal (x) and vertical (y) distances in kilometers.</p><label for="x">X distance (km):</label><input type="number" id="x" min="0" placeholder="Enter x"><label for="y">Y distance (km):</label><input type="number" id="y" min="0" placeholder="Enter y"><button onclick="checkDistance()">Check Distance</button><p id="result" class="result"></p><a class="back" href="resume.html">Back to Resume</a></div><script>
function checkDistance(){const x=document.getElementById('x'),y=document.getElementById('y'),out=document.getElementById('result');if(x.value.trim()===''||y.value.trim()===''||!Number.isFinite(x.valueAsNumber)||!Number.isFinite(y.valueAsNumber)||x.valueAsNumber<0||y.valueAsNumber<0){out.className='result error';out.textContent='Please enter valid positive numbers for x and y.';return}const distance=Math.sqrt(x.valueAsNumber**2+y.valueAsNumber**2);out.className='result';out.textContent='You live '+distance.toFixed(2)+' km from the university.'}
</script></body></html>
